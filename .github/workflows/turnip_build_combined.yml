name: Build Turnip (Combined)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            suffix: ""
            extra_patch: ""
            extra_script: ""
            meta_desc: "Pure Mesa main — Snapdragon 600–800 series, 7 Gen and 8 Gen 1–3 (Adreno 600–700 series)."
          - variant: a8xx
            suffix: "-A8xx"
            extra_patch: "patches/tu8_kgsl_26.patch"
            extra_script: "patches/fix_a8xx_dev_info.py:patches/apply_a8xx_gpus.py"
            meta_desc: "A8xx experimental Turnip driver for Snapdragon 8 Elite (A810/A825/A829/A830). Includes A8xx-specific patches on top of Mesa main. KGSL build."
          - variant: 710-720-test
            suffix: "-710-720-Test"
            extra_patch: ""
            extra_script: "patches/a710-720.py"
            meta_desc: "EXPERIMENTAL — Adds Adreno 710, 720, and 722 support on top of Mesa main with hardware-specific magic registers and tuned GPU properties. Unverified on real hardware — use sysmem mode. All other GPUs unaffected."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            patchelf \
            unzip \
            flex \
            bison \
            git \
            perl \
            python3-pip \
            glslang-tools \
            curl \
            zip \
            patch \
            libxrandr-dev \
            libxxf86vm-dev \
            libxcb-shm0-dev \
            libxcb-glx0-dev \
            libxext-dev \
            llvm-19 \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxshmfence-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libexpat1-dev \
            libwayland-dev \
            wayland-protocols \
            pkg-config
          pip3 install meson ninja mako

      - name: Build
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          [[ -n "${{ matrix.extra_patch }}" ]] && export EXTRA_PATCH="${{ matrix.extra_patch }}"
          [[ -n "${{ matrix.extra_script }}" ]] && export EXTRA_SCRIPT="${{ matrix.extra_script }}"
          ./build_turnip.sh

      - name: Rename Archive
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")
          TAG="v${MESA_VERSION}-${BUILD_DATE}"
          
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              | jq -r '.[].tagName' \
              | grep -oP "^v${MESA_VERSION}-${BUILD_DATE}-r\K[0-9]+$" \
              | sort -n \
              | tail -1)
            NEXT_R=$(( ${EXISTING:-1} + 1 ))
            TAG="${TAG}-r${NEXT_R}"
            echo "Tag already exists — using ${TAG}"
          fi
          
          if [[ "$TAG" =~ -r([0-9]+)$ ]]; then
            DAY_NUM="${BASH_REMATCH[1]}"
          else
            DAY_NUM="1"
          fi
          
          ARCHIVE_NAME="Turnip-${TAG}${{ matrix.suffix }}.tar.gz"
          
          echo "Looking for archive files in turnip_workdir/"
          ls -la turnip_workdir/
          
          if ls turnip_workdir/*.tar.gz 2>/dev/null | head -1 | grep -q .; then
            SRC=$(ls turnip_workdir/*.tar.gz | head -1)
            echo "Found tar.gz archive: $SRC"
            
            UNZIP_DIR=$(mktemp -d)
            tar -xzf "$SRC" -C "$UNZIP_DIR"
            
            META_NAME="Mesa Turnip ${TAG}${{ matrix.suffix }}"
            META_DESC="${{ matrix.meta_desc }}"
            
            if [ -f "$UNZIP_DIR/meta.json" ]; then
              python3 << PYEOF
import json
p = '$UNZIP_DIR/meta.json'
with open(p, 'r') as f:
    m = json.load(f)
m['name'] = '$META_NAME'
m['packageVersion'] = '$DAY_NUM'
if '$META_DESC':
    m['description'] = '$META_DESC'
with open(p, 'w') as f:
    json.dump(m, f, indent=2)
PYEOF
            else
              cat > "$UNZIP_DIR/meta.json" << EOF
{
  "schemaVersion": 1,
  "name": "${META_NAME}",
  "description": "${META_DESC}",
  "author": "The412Banner",
  "packageVersion": "${DAY_NUM}",
  "vendor": "Mesa",
  "driverVersion": "Vulkan",
  "minApi": 28,
  "libraryName": "libvulkan_freedreno.so"
}
EOF
            fi
            
            (cd "$UNZIP_DIR" && tar -czf "$GITHUB_WORKSPACE/turnip_workdir/${ARCHIVE_NAME}" ./*)
            echo "Created re-packed archive: turnip_workdir/${ARCHIVE_NAME}"
          else
            echo "Error: No .tar.gz file found in turnip_workdir/"
            echo "Directory contents:"
            ls -la turnip_workdir/
            exit 1
          fi
          
          VK_PATCH=$(grep '^#define VK_HEADER_VERSION ' turnip_workdir/mesa/include/vulkan/vulkan_core.h 2>/dev/null | awk '{print $3}' || echo "unknown")
          VK_MINOR=$(grep 'define TU_API_VERSION' turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc 2>/dev/null | grep -oP 'VK_MAKE_VERSION\(\s*[0-9]+,\s*\K[0-9]+' || echo "unknown")
          VULKAN_VERSION="Vulkan 1.${VK_MINOR}.${VK_PATCH}"
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "vulkan_version=${VULKAN_VERSION}" >> $GITHUB_OUTPUT

      - name: Save release info
        if: matrix.variant == 'regular'
        run: |
          mkdir -p release-info
          echo "${{ steps.info.outputs.tag }}"          > release-info/tag.txt
          echo "${{ steps.info.outputs.mesa_version }}" > release-info/mesa_version.txt
          echo "${{ steps.info.outputs.build_date }}"   > release-info/build_date.txt
          echo "${{ steps.info.outputs.githash }}"      > release-info/githash.txt
          echo "${{ steps.info.outputs.githash_full }}" > release-info/githash_full.txt
          echo "${{ steps.info.outputs.commit_date }}"  > release-info/commit_date.txt
          echo "${{ steps.info.outputs.commit_title }}" > release-info/commit_title.txt
          echo "${{ steps.info.outputs.vulkan_version }}" > release-info/vulkan_version.txt

      - name: Upload release info
        if: matrix.variant == 'regular'
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info/

      - name: Upload driver archive
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ matrix.variant }}
          path: turnip_workdir/Turnip-*.tar.gz

  release:
    runs-on: ubuntu-24.04-arm
    needs: build

    steps:
      - name: Checkout repo (for patch list)
        uses: actions/checkout@v4

      - name: Download driver archives
        uses: actions/download-artifact@v4
        with:
          pattern: turnip-*
          merge-multiple: true
          path: ./archives

      - name: Download release info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: ./release-info

      - name: Write release body
        run: |
          TAG=$(cat release-info/tag.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          GITHASH=$(cat release-info/githash.txt)
          GITHASH_FULL=$(cat release-info/githash_full.txt)
          COMMIT_DATE=$(cat release-info/commit_date.txt)
          COMMIT_TITLE=$(cat release-info/commit_title.txt)
          VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          ARCHIVE_REGULAR="Turnip-${TAG}.tar.gz"
          ARCHIVE_A8XX="Turnip-${TAG}-A8xx.tar.gz"
          ARCHIVE_A7XX_TEST="Turnip-${TAG}-710-720-Test.tar.gz"
          MESA_URL="https://gitlab.freedesktop.org/mesa/mesa/-/commit/${GITHASH_FULL}"
          {
            printf "> ⚠️ **AUTOMATED BUILD — ARM64 native. Not guaranteed stable. Use at your own risk.**\n\n"
            printf '%s\n\n' '---'
            printf "### Mesa Upstream\n\n"
            printf "| | |\n"
            printf "| :--- | :--- |\n"
            printf "| **Version** | %s |\n"        "${MESA_VERSION}"
            printf "| **Commit** | [\`%s\`](%s) |\n" "${GITHASH}" "${MESA_URL}"
            printf "| **Vulkan version** | %s |\n"  "${VULKAN_VERSION}"
            printf "| **Commit date** | %s |\n"    "${COMMIT_DATE}"
            printf "| **Commit title** | %s |\n"   "${COMMIT_TITLE}"
            printf "| **Build date** | %s |\n"     "${BUILD_DATE}"
            printf "| **Architecture** | ARM64 (aarch64) |\n"
            printf "| **Platform** | Linux Native |\n\n"
            printf '%s\n\n' '---'
            printf "### A6xx / A7xx — What's In This Driver\n\n"
            printf "Pure Mesa \`main\` — built directly from the latest upstream commit with no source patches.\n\n"
            printf "Targets Snapdragon 600–800 series, 7 Gen and 8 Gen 1–3 (Adreno 600–700 series).\n\n"
            printf '%s\n\n' '---'
            printf "### A8xx — What's In This Driver\n\n"
            printf "Same base as above, plus the following A8xx-specific changes on top of Mesa \`main\`:\n\n"
            printf "**Applied via [tu8_kgsl_26.patch](https://github.com/The412Banner/Banners-Turnip/blob/A8xx/patches/tu8_kgsl_26.patch):**\n\n"
            printf '%s\n' "- **u_gralloc UBWC fix** — disables the \`gmsm\` magic check for Qualcomm gralloc buffer detection, which stopped working in newer gralloc versions."
            printf '%s\n\n' "- **drm-shim entries** — adds A810/A825/A829 to the Mesa drm-shim device table."
            printf "**Applied via \`fix_a8xx_dev_info.py\`:**\n\n"
            printf '%s\n' "- Adds \`disable_gmem\` property to \`freedreno_dev_info.h\` — tells the driver to skip GMEM for A810."
            printf '%s\n\n' "- Adds the GMEM disable check in \`tu_cmd_buffer.cc\`."
            printf "**Applied via \`apply_a8xx_gpus.py\`:**\n\n"
            printf '%s\n' "- Adds **A825** GPU entry — completely missing from mesa/main."
            printf '%s\n' "- Adds \`chip_id=0x44010000\` to A810 for KGSL."
            printf '%s\n' "- Adds \`disable_gmem = True\` to A810."
            printf '%s\n\n' "- Adds extra chip IDs to A829 for additional device revisions."
            printf '%s\n\n' '---'
            printf "### A710 / A720 / A722 Test Build — What's In This Driver\n\n"
            printf "> ⚠️ **UNVERIFIED — Needs testing on real hardware before this is merged into the standard build.**\n\n"
            printf "Pure Mesa \`main\` plus hardware-specific GPU entries for Adreno 710, 720, and 722 injected via [\`a710-720.py\`](https://github.com/The412Banner/Banners-Turnip/blob/A8xx/patches/a710-720.py):\n\n"
            printf '%s\n' "- **A710** (\`chip_id=0x07010000\`)"
            printf '%s\n' "- **A720** (\`chip_id=0x43020000\`)"
            printf '%s\n\n' "- **A722** (\`chip_id=0x43020100\`)"
            printf "> **Recommended: use sysmem mode.** Force sysmem via \`TU_DEBUG=sysmem\` in your emulator/app environment until GMEM is confirmed stable on real hardware.\n\n"
            printf '%s\n\n' '---'
            printf "### Adreno GPU Support\n\n"
            printf "| Series | File | Notes |\n"
            printf "| :--- | :--- | :--- |\n"
            printf "| A6xx / A7xx | \`%s\` | Pure Mesa main — Snapdragon 600–800 series, 7/8 Gen 1–3 |\n" "${ARCHIVE_REGULAR}"
            printf "| A8xx | \`%s\` | Experimental — Snapdragon 8 Elite (A810/A825/A829/A830) |\n" "${ARCHIVE_A8XX}"
            printf "| A710 / A720 / A722 | \`%s\` | ⚠️ UNVERIFIED — Adreno 710/720/722 test build |\n\n" "${ARCHIVE_A7XX_TEST}"
            printf '%s\n\n' '---'
            printf "### Installation (Linux ARM64)\n\n"
            printf '%s\n' "```bash"
            printf '%s\n' "# Extract the driver"
            printf '%s\n' "tar -xzf <driver-file>.tar.gz"
            printf '%s\n' ""
            printf '%s\n' "# Copy to system directory"
            printf '%s\n' "sudo cp libvulkan_freedreno.so /usr/local/lib/"
            printf '%s\n' ""
            printf '%s\n' "# Or set environment variable for custom path"
            printf '%s\n' "export VK_ICD_FILENAMES=/path/to/libvulkan_freedreno.so"
            printf '%s\n' "```"
          } > release_body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat release-info/tag.txt)
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Turnip ${TAG} (Linux ARM64)" \
            --notes-file release_body.md \
            archives/*.tar.gz

      - name: Update README with build info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin A8xx
          git checkout A8xx
          git pull --rebase origin A8xx
          export BT_TAG=$(cat release-info/tag.txt)
          export BT_MESA_VERSION=$(cat release-info/mesa_version.txt)
          export BT_BUILD_DATE=$(cat release-info/build_date.txt)
          export BT_GITHASH=$(cat release-info/githash.txt)
          export BT_GITHASH_FULL=$(cat release-info/githash_full.txt)
          export BT_COMMIT_DATE=$(cat release-info/commit_date.txt)
          export BT_COMMIT_TITLE=$(cat release-info/commit_title.txt)
          export BT_VULKAN_VERSION=$(cat release-info/vulkan_version.txt)
          export BT_REPO="$GITHUB_REPOSITORY"
          python3 .github/scripts/update_readme.py
          python3 .github/scripts/update_builds.py
          git add README.md Mesa-commit-history.md
          git diff --staged --quiet || git commit -m "docs: update build info [$BT_TAG]"
          git push origin A8xx
