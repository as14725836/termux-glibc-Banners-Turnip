name: Build Turnip A8xx (Experimental)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a8xx
            tag_suffix: "-a8xx-test"
            tar_suffix: "-A8xx"
            extra_script: "patches/fix_a8xx_dev_info.py:patches/apply_a8xx_gpus.py"
            meta_desc: "A8xx experimental Turnip driver for Snapdragon 8 Elite (A810/A825/A829/A830). Includes A8xx-specific patches on top of Mesa main. KGSL build."
            release_label: "A8xx Experimental"

          - variant: a830-tuned
            tag_suffix: "-a830-tuned-test"
            tar_suffix: "-A830-Tuned"
            extra_script: "patches/fix_a8xx_dev_info.py:patches/apply_a8xx_gpus.py:patches/tune_a830.py"
            meta_desc: "A830 performance-tuned Turnip driver for Snapdragon 8 Elite. Disables has_fs_tex_prefetch for A830 per Mesa upstream TODO — matches behaviour of every other A8xx GPU. Experimental."
            release_label: "A830 Tuned"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            patchelf \
            unzip \
            flex \
            bison \
            git \
            perl \
            python3-pip \
            glslang-tools \
            curl \
            zip \
            meson \
            python3-mako \
            libxrandr-dev \
            libxxf86vm-dev \
            libxcb-shm0-dev \
            libxcb-glx0-dev \
            libxext-dev \
            llvm-19 \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxshmfence-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libexpat1-dev \
            libwayland-dev \
            wayland-protocols \
            pkg-config
          pip3 install meson ninja mako
          
      - name: Build
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          export EXTRA_PATCH="patches/tu8_kgsl_26.patch"
          export EXTRA_SCRIPT="${{ matrix.extra_script }}"
          export CREATE_ARCHIVE=1
          ./build_turnip.sh

      - name: List files for debugging
        run: |
          echo "=== Contents of turnip_workdir ==="
          ls -la turnip_workdir/ || echo "Directory not found"
          echo "=== Contents of turnip_workdir/install/lib ==="
          ls -la turnip_workdir/install/lib/ 2>/dev/null || echo "Not found"

      - name: Rename Archive
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")
          TAG_SUFFIX="${{ matrix.tag_suffix }}"
          TAG="v${MESA_VERSION}-${BUILD_DATE}${TAG_SUFFIX}"
          
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              | jq -r '.[].tagName' \
              | grep -oP "^v${MESA_VERSION}-${BUILD_DATE}${TAG_SUFFIX}-r\K[0-9]+$" \
              | sort -n \
              | tail -1)
            NEXT_R=$(( ${EXISTING:-1} + 1 ))
            TAG="${TAG}-r${NEXT_R}"
          fi
          
          if [[ "$TAG" =~ -r([0-9]+)$ ]]; then
            DAY_NUM="${BASH_REMATCH[1]}"
          else
            DAY_NUM="1"
          fi
          
          TAR_SUFFIX="${{ matrix.tar_suffix }}"
          TAR_NAME="Turnip-${TAG}${TAR_SUFFIX}.tar.gz"
          
          # 检查并处理归档文件
          if ls turnip_workdir/*.tar.gz 2>/dev/null | grep -q .; then
            SRC=$(ls turnip_workdir/*.tar.gz | head -1)
            echo "Found tar.gz: $SRC"
            cp "$SRC" "turnip_workdir/${TAR_NAME}"
          elif ls turnip_workdir/*.zip 2>/dev/null | grep -q .; then
            SRC=$(ls turnip_workdir/*.zip | head -1)
            echo "Found zip: $SRC, converting to tar.gz"
            UNZIP_DIR=$(mktemp -d)
            unzip -q "$SRC" -d "$UNZIP_DIR"
            META_NAME="Mesa Turnip ${TAG}${TAR_SUFFIX}"
            META_DESC="${{ matrix.meta_desc }}"
            if [ -f "$UNZIP_DIR/meta.json" ]; then
              python3 -c "import json,sys; p='${UNZIP_DIR}/meta.json'; m=json.load(open(p)); m['name']='${META_NAME}'; m['packageVersion']='${DAY_NUM}'; d='${META_DESC}'; m.update({'description':d} if d else {}); json.dump(m,open(p,'w'),indent=2)"
            fi
            (cd "$UNZIP_DIR" && tar -czf "../../turnip_workdir/${TAR_NAME}" ./*)
          else
            echo "ERROR: No tar.gz or zip file found in turnip_workdir/"
            echo "Contents of turnip_workdir:"
            ls -la turnip_workdir/
            exit 1
          fi
          
          # 验证文件创建成功
          if [ ! -f "turnip_workdir/${TAR_NAME}" ]; then
            echo "ERROR: Failed to create ${TAR_NAME}"
            exit 1
          fi
          
          VK_PATCH=$(grep '^#define VK_HEADER_VERSION ' turnip_workdir/mesa/include/vulkan/vulkan_core.h 2>/dev/null | awk '{print $3}' || echo "unknown")
          VK_MINOR=$(grep 'define TU_API_VERSION' turnip_workdir/mesa/src/freedreno/vulkan/tu_device.cc 2>/dev/null | grep -oP 'VK_MAKE_VERSION\(\s*[0-9]+,\s*\K[0-9]+' || echo "unknown")
          VULKAN_VERSION="Vulkan 1.${VK_MINOR}.${VK_PATCH}"
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "vulkan_version=${VULKAN_VERSION}" >> $GITHUB_OUTPUT
          echo "tar_name=${TAR_NAME}" >> $GITHUB_OUTPUT

      - name: Write release body
        run: |
          VARIANT="${{ matrix.variant }}"
          LABEL="${{ matrix.release_label }}"
          {
            printf "> ⚠️ **EXPERIMENTAL %s BUILD — Not guaranteed stable. Use at your own risk.**\n\n" "${LABEL}"
            printf '%s\n\n' '---'
            printf "### Mesa Upstream\n\n"
            printf "| | |\n"
            printf "| :--- | :--- |\n"
            printf "| **Version** | %s |\n"       "${{ steps.info.outputs.mesa_version }}"
            printf "| **Commit** | [\`%s\`](https://gitlab.freedesktop.org/mesa/mesa/-/commit/%s) |\n" "${{ steps.info.outputs.githash }}" "${{ steps.info.outputs.githash_full }}"
            printf "| **Vulkan version** | %s |\n" "${{ steps.info.outputs.vulkan_version }}"
            printf "| **Commit date** | %s |\n"   "${{ steps.info.outputs.commit_date }}"
            printf "| **Commit title** | %s |\n"  "${{ steps.info.outputs.commit_title }}"
            printf "| **Build date** | %s |\n"    "${{ steps.info.outputs.build_date }}"
            printf "| **Architecture** | ARM64 (aarch64) |\n"
            printf "| **Platform** | Linux Native |\n\n"
            printf '%s\n\n' '---'
            printf "### What's In This Driver\n\n"
            printf "Base: Mesa \`main\` + A8xx-specific patches. All variants share:\n\n"
            printf "**Applied via [tu8_kgsl_26.patch](https://github.com/The412Banner/Banners-Turnip/blob/A8xx/patches/tu8_kgsl_26.patch):**\n\n"
            printf '%s\n' "- **u_gralloc UBWC fix** — disables the \`gmsm\` magic check for Qualcomm gralloc buffer detection, which stopped working in newer gralloc versions."
            printf '%s\n\n' "- **drm-shim entries** — adds A810/A825/A829 to the Mesa drm-shim device table."
            printf "**Applied via \`fix_a8xx_dev_info.py\`:**\n\n"
            printf '%s\n' "- Adds \`disable_gmem\` property to \`freedreno_dev_info.h\` — tells the driver to skip GMEM for A810."
            printf '%s\n\n' "- Adds the GMEM disable check in \`tu_cmd_buffer.cc\`."
            printf "**Applied via \`apply_a8xx_gpus.py\`:**\n\n"
            printf '%s\n' "- Adds **A825** GPU entry — completely missing from mesa/main."
            printf '%s\n' "- Adds \`chip_id=0x44010000\` to A810 for KGSL."
            printf '%s\n' "- Adds \`disable_gmem = True\` to A810."
            printf '%s\n\n' "- Adds extra chip IDs to A829 for additional device revisions."
            if [[ "$VARIANT" == "a830-tuned" ]]; then
              printf "**Additionally applied via \`tune_a830.py\` (A830 Tuned only):**\n\n"
              printf '%s\n\n' "- Sets \`has_fs_tex_prefetch = False\` for A830 — Mesa upstream has a TODO noting this is likely needed for A830. Every other A8xx GPU (A810, A829, A840) already has this disabled. A830 was the only exception, inheriting \`True\` from the A7xx chain. This aligns A830 with all other A8xx hardware."
            fi
            printf '%s\n\n' '---'
            printf "### Installation (Linux ARM64)\n\n"
            printf '%s\n' "```bash"
            printf '%s\n' "# Extract the driver"
            printf '%s\n' "tar -xzf ${{ steps.info.outputs.tar_name }}"
            printf '%s\n' ""
            printf '%s\n' "# Copy to system directory"
            printf '%s\n' "sudo cp libvulkan_freedreno.so /usr/local/lib/"
            printf '%s\n' ""
            printf '%s\n' "# Or set environment variable for custom path"
            printf '%s\n' "export VK_ICD_FILENAMES=/path/to/libvulkan_freedreno.so"
            printf '%s\n' "```"
          } > release_body.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-${{ matrix.variant }}-${{ steps.info.outputs.tag }}
          path: turnip_workdir/${{ steps.info.outputs.tar_name }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "Turnip ${{ steps.info.outputs.tag }} ${{ matrix.release_label }} (Linux ARM64)"
          prerelease: true
          make_latest: false
          body_path: release_body.md
          files: turnip_workdir/${{ steps.info.outputs.tar_name }}
