name: Build Turnip (Perf 6xx/7xx)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            patchelf \
            unzip \
            flex \
            bison \
            git \
            perl \
            python3-pip \
            glslang-tools \
            curl \
            zip \
            patch \
            libxrandr-dev \
            libxxf86vm-dev \
            libxcb-shm0-dev \
            libxcb-glx0-dev \
            libxext-dev \
            llvm-19 \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxshmfence-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libexpat1-dev \
            libwayland-dev \
            wayland-protocols \
            pkg-config
          pip3 install meson ninja mako

      - name: Build
        run: |
          chmod +x build_turnip_perf.sh
          export BUILD_VERSION="${{ github.run_number }}"
          ./build_turnip_perf.sh

      - name: Package and rename
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_NUM="r1"
          BUILD_NUM=$(cat perf_build_number.txt | tr -d '[:space:]')
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")

          FULL_NAME="Banners Turnip Perf ${MESA_VERSION} ${RELEASE_NUM}-b${BUILD_NUM}"
          ARCHIVE_NAME="Banners-Turnip-Perf-${MESA_VERSION}-${RELEASE_NUM}-b${BUILD_NUM}.tar.gz"
          TAG="perf-${MESA_VERSION}-${RELEASE_NUM}-b${BUILD_NUM}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            TAG="${TAG}-retry${{ github.run_number }}"
            echo "Tag already exists — using ${TAG}"
          fi

          # Repack archive with updated meta.json
          if ls turnip_workdir/*.tar.gz 2>/dev/null | grep -q .; then
            SRC=$(ls turnip_workdir/*.tar.gz | head -1)
            mkdir -p /tmp/turnip-repack && cd /tmp/turnip-repack
            tar -xzf "$GITHUB_WORKSPACE/$SRC"
          else
            SRC=$(ls turnip_workdir/*.zip | head -1)
            mkdir -p /tmp/turnip-repack && cd /tmp/turnip-repack
            unzip -q "$GITHUB_WORKSPACE/$SRC"
          fi
          
          cat > meta.json << METAEOF
          {
            "schemaVersion": 1,
            "name": "${FULL_NAME}",
            "description": "A6xx/A7xx performance build — Mesa main (git ${GITHASH}). O3 + ThinLTO. KGSL (Linux ARM64).",
            "author": "The412Banner",
            "packageVersion": "1",
            "vendor": "Mesa",
            "driverVersion": "Vulkan 1.4.335",
            "minApi": 28,
            "libraryName": "libvulkan_freedreno.so"
          }
          METAEOF
          
          tar -czf "$GITHUB_WORKSPACE/turnip_workdir/${ARCHIVE_NAME}" ./*
          cd "$GITHUB_WORKSPACE"

          # Increment build number and commit
          echo $((BUILD_NUM + 1)) > perf_build_number.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perf_build_number.txt
          git commit -m "ci: bump perf build number to $((BUILD_NUM + 1))"
          git push

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "full_name=${FULL_NAME}" >> $GITHUB_OUTPUT
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT

      - name: Save release info
        run: |
          mkdir -p release-info
          echo "${{ steps.info.outputs.tag }}"          > release-info/tag.txt
          echo "${{ steps.info.outputs.full_name }}"    > release-info/full_name.txt
          echo "${{ steps.info.outputs.archive_name }}" > release-info/archive_name.txt
          echo "${{ steps.info.outputs.mesa_version }}" > release-info/mesa_version.txt
          echo "${{ steps.info.outputs.build_date }}"   > release-info/build_date.txt
          echo "${{ steps.info.outputs.githash }}"      > release-info/githash.txt
          echo "${{ steps.info.outputs.githash_full }}" > release-info/githash_full.txt
          echo "${{ steps.info.outputs.commit_date }}"  > release-info/commit_date.txt
          echo "${{ steps.info.outputs.commit_title }}" > release-info/commit_title.txt

      - name: Upload release info
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release-info/

      - name: Upload driver archive
        uses: actions/upload-artifact@v4
        with:
          name: turnip-perf
          path: turnip_workdir/Banners-Turnip-Perf-*.tar.gz

  release:
    runs-on: ubuntu-24.04-arm
    needs: build

    steps:
      - name: Download driver archive
        uses: actions/download-artifact@v4
        with:
          name: turnip-perf
          path: ./archives

      - name: Download release info
        uses: actions/download-artifact@v4
        with:
          name: release-info
          path: ./release-info

      - name: Write release body
        run: |
          TAG=$(cat release-info/tag.txt)
          FULL_NAME=$(cat release-info/full_name.txt)
          MESA_VERSION=$(cat release-info/mesa_version.txt)
          BUILD_DATE=$(cat release-info/build_date.txt)
          GITHASH=$(cat release-info/githash.txt)
          GITHASH_FULL=$(cat release-info/githash_full.txt)
          COMMIT_DATE=$(cat release-info/commit_date.txt)
          COMMIT_TITLE=$(cat release-info/commit_title.txt)
          MESA_URL="https://gitlab.freedesktop.org/mesa/mesa/-/commit/${GITHASH_FULL}"

          {
            printf "> ⚠️ **AUTOMATED BUILD — ARM64 native. Not guaranteed stable. Use at your own risk.**\n\n"
            printf '%s\n\n' '---'
            printf "### Mesa Upstream\n\n"
            printf "| | |\n"
            printf "| :--- | :--- |\n"
            printf "| **Version** | %s |\n"              "${MESA_VERSION}"
            printf "| **Commit** | [\`%s\`](%s) |\n"    "${GITHASH}" "${MESA_URL}"
            printf "| **Commit date** | %s |\n"          "${COMMIT_DATE}"
            printf "| **Commit title** | %s |\n"         "${COMMIT_TITLE}"
            printf "| **Build date** | %s |\n"           "${BUILD_DATE}"
            printf "| **Architecture** | ARM64 (aarch64) |\n"
            printf "| **Platform** | Linux Native |\n\n"
            printf '%s\n\n' '---'
            printf "### Build Configuration\n\n"
            printf "Pure Mesa \`main\` — no source patches. Performance-optimized build for A6xx/A7xx.\n\n"
            printf "**Compiler flags:** \`-O3 -fno-plt -flto=thin\`\n\n"
            printf "**Meson:** \`-Db_ndebug=true\` (assertions stripped)\n\n"
            printf "Targets Snapdragon 600–800 series, 7 Gen and 8 Gen 1–3 (Adreno 600–700 series).\n\n"
            printf '%s\n\n' '---'
            printf "### Adreno GPU Support\n\n"
            printf "| Series | Notes |\n"
            printf "| :--- | :--- |\n"
            printf "| **A6xx** | Snapdragon 600–800 series (SD835, SD845, SD855, SD865) |\n"
            printf "| **A7xx** | Snapdragon 8 Gen 1 / Gen 2 (SD8450, SD8475, SD8550) |\n\n"
            printf "> A8xx (Snapdragon 8 Elite) is **not supported** by this build.\n\n"
            printf '%s\n\n' '---'
            printf "### Installation (Linux ARM64)\n\n"
            printf '%s\n' "```bash"
            printf '%s\n' "# Extract the driver"
            printf '%s\n' "tar -xzf <driver-file>.tar.gz"
            printf '%s\n' ""
            printf '%s\n' "# Copy to system directory"
            printf '%s\n' "sudo cp libvulkan_freedreno.so /usr/local/lib/"
            printf '%s\n' ""
            printf '%s\n' "# Or set environment variable for custom path"
            printf '%s\n' "export VK_ICD_FILENAMES=/path/to/libvulkan_freedreno.so"
            printf '%s\n' "```"
          } > release_body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat release-info/tag.txt)
          FULL_NAME=$(cat release-info/full_name.txt)

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${FULL_NAME} (Linux ARM64)" \
            --notes-file release_body.md \
            archives/*.tar.gz
