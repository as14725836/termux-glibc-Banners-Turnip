name: Build Turnip (ARM64 Linux)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            patchelf \
            unzip \
            flex \
            bison \
            git \
            perl \
            python3-pip \
            glslang-tools \
            curl \
            zip \
            libxrandr-dev \
            libxxf86vm-dev \
            libxcb-shm0-dev \
            libxcb-glx0-dev \
            libxext-dev \
            gcc \
            clang \
            llvm-19 \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxshmfence-dev \
            libdrm-dev \
            libgbm-dev \
            libegl1-mesa-dev \
            libexpat1-dev \
            libwayland-dev \
            wayland-protocols \
            pkg-config
          sudo pip3 install meson ninja mako

      - name: Build Drivers
        run: |
          chmod +x build_turnip.sh
          export BUILD_VERSION="${{ github.run_number }}"
          ./build_turnip.sh

      - name: Read build info
        id: info
        run: |
          GITHASH=$(git -C turnip_workdir/mesa rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GITHASH_FULL=$(git -C turnip_workdir/mesa rev-parse HEAD 2>/dev/null || echo "")
          COMMIT_DATE=$(git -C turnip_workdir/mesa log -1 --format="%ci" 2>/dev/null | cut -d' ' -f1 || echo "unknown")
          COMMIT_TITLE=$(git -C turnip_workdir/mesa log -1 --format="%s" 2>/dev/null || echo "")
          MESA_VERSION=$(cat turnip_workdir/mesa/VERSION 2>/dev/null | sed 's/-devel.*//' | tr -d '[:space:]' || echo "unknown")
          BUILD_DATE=$(date +%Y%m%d)
          
          if ls turnip_workdir/*.tar.gz 2>/dev/null | grep -q .; then
            ARCHIVE=$(ls turnip_workdir/*.tar.gz | head -1)
          else
            ARCHIVE=$(ls turnip_workdir/*.zip 2>/dev/null | head -1)
          fi
          
          FILENAME=$(basename "$ARCHIVE")
          TAG="v${MESA_VERSION}-${BUILD_DATE}-linux-arm64"
          
          echo "githash=${GITHASH}" >> $GITHUB_OUTPUT
          echo "githash_full=${GITHASH_FULL}" >> $GITHUB_OUTPUT
          echo "commit_date=${COMMIT_DATE}" >> $GITHUB_OUTPUT
          echo "commit_title=${COMMIT_TITLE}" >> $GITHUB_OUTPUT
          echo "mesa_version=${MESA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "filename=${FILENAME}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Write release body
        run: |
          cat > release_body.md << 'BODYEOF'
          > ⚠️ **NIGHTLY / AUTOMATED BUILD — ARM64 native build. Not guaranteed stable. Use at your own risk.**

          ---

          ### 🚀 Turnip Vulkan Driver (Linux ARM64)

          ---

          ### 📊 Mesa Upstream Status

          | | Details |
          | :--- | :--- |
          | **Source** | [mesa/mesa · main](https://gitlab.freedesktop.org/mesa/mesa) |
          | **Commit** | [`${{ steps.info.outputs.githash }}`](https://gitlab.freedesktop.org/mesa/mesa/-/commit/${{ steps.info.outputs.githash_full }}) |
          | **Commit date** | ${{ steps.info.outputs.commit_date }} |
          | **Commit title** | ${{ steps.info.outputs.commit_title }} |
          | **Mesa version** | ${{ steps.info.outputs.mesa_version }} |
          | **Build date** | ${{ steps.info.outputs.build_date }} |
          | **Architecture** | ARM64 (aarch64) |
          | **Platform** | Linux Native |
          | **Driver** | KGSL |

          ---

          ### 📱 Adreno GPU Support

          | Series | Status | Devices |
          | :--- | :--- | :--- |
          | **A6xx** | ✅ Supported | Snapdragon 600–800 series (2019–2022) |
          | **A7xx** | ✅ Supported | Snapdragon 7/8 Gen 1–3 (2022–2024) |
          | **A8xx** | ⚠️ Experimental | Snapdragon 8 Elite (2024–2025) — may work, untested |

          ---

          ### ⬇️ Download

          | File | Description |
          | :--- | :--- |
          | `${{ steps.info.outputs.filename }}` | Turnip driver for Linux ARM64 (KGSL) |

          **How to install:**
          ```bash
          # Extract the driver
          tar -xzf ${{ steps.info.outputs.filename }}
          
          # Copy to system directory
          sudo cp libvulkan_freedreno.so /usr/local/lib/
          
          # Or set environment variable for custom path
          export VK_ICD_FILENAMES=/path/to/libvulkan_freedreno.so
          ```
          BODYEOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Turnip-Linux-ARM64-${{ steps.info.outputs.tag }}
          path: turnip_workdir/*.tar.gz

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "Turnip Linux ARM64 ${{ steps.info.outputs.mesa_version }} — ${{ steps.info.outputs.build_date }}"
          prerelease: false
          make_latest: true
          body_path: release_body.md
          files: turnip_workdir/*.tar.gz
